name: Auto Release

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 19 * * *" # UTC 19:00 = 北京时间凌晨3点
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  job-on-schedule:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git
        run: |
          git config --global user.name "${{ secrets.GIT_NAME }}"
          git config --global user.email "${{ secrets.GIT_EMAIL }}"

      - name: Build & Check Update
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          python ./build.py
          VERSION=$(cat ./*/version)

          # 检测本地文件变更
          if [ -n "$(git status --porcelain)" ]; then
            echo "文件存在更新，提交代码"
            git add .
            git commit -m "Upd ver to $VERSION at $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            # 获取最新release间隔天数（改用单行python避免yaml语法报错）
            diff_days=$(curl -s https://api.github.com/repos/wabisabi926/rogsoft_openlist/releases/latest | python3 -c "import sys,json,datetime;d=json.load(sys.stdin);p=datetime.datetime.strptime(d['published_at'],'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc);print((datetime.datetime.now(datetime.timezone.utc)-p).days)")
            echo "距离上个Release天数: $diff_days"
            # 超过58天强制发Release，防止Cron工作流休眠
            if [ "$diff_days" -gt 58 ]; then
              wget --header="Authorization: token $GIT_TOKEN" -P ../ $BASE_URL/release.py
              python ../release.py --ver "$VERSION" --token "$GIT_TOKEN"
              echo "定时强制发布，避免工作流休眠"
            else
              echo "文件无变动，无需操作"
            fi
          fi

  job-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git
        run: |
          git config --global user.name "${{ secrets.GIT_NAME }}"
          git config --global user.email "${{ secrets.GIT_EMAIL }}"

      - name: Build & Create Release
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          SF_PASS: ${{ secrets.SF_PASS }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          python ./build.py
          VERSION=$(cat ./*/version)

          if [ -n "$(git status --porcelain)" ]; then
            echo "检测文件更新，提交代码"
            git add .
            git commit -m "Upd ver to $VERSION at $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "文件无变更"
          fi

          # GitHub Release
          wget --header="Authorization: token $GIT_TOKEN" $BASE_URL/release.py
          python ./release.py --ver "$VERSION" --token "$GIT_TOKEN"

          # SourceForge同步
          mkdir v"$VERSION"
          mv openlist.tar.gz ./v"$VERSION"
          sshpass -p "$SF_PASS" rsync -avz -e "ssh -o StrictHostKeyChecking=no" LICENSE README.md v"$VERSION" genius-society@frs.sourceforge.net:/home/frs/project/rogsoft-openlist/
