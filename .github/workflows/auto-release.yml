name: Auto Release

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure Git identity
        run: |
          git config --global user.name "${{ secrets.GIT_NAME }}"
          git config --global user.email "${{ secrets.GIT_EMAIL }}"

      - name: Run build script
        run: python ./build.py

      - name: Read version string
        id: getver
        run: echo "VER=$(cat ./*/version)" >> $GITHUB_ENV

      - name: Install gh cli
        run: sudo apt update && sudo apt install gh -y

      - name: Create GitHub Release
        env:
          # 关键修复：gh cli 识别变量名为 GH_TOKEN
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          VERSION=${{ env.VER }}
          # 判断同名tag是否存在，避免重复创建失败
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --title "Release v${VERSION}" \
              --notes "Auto build artifact" \
              openlist.tar.gz
            echo "✅ 创建发布 v${VERSION} 成功"
          else
            echo "ℹ️ 版本 v${VERSION} 已存在，跳过创建Release"
          fi
