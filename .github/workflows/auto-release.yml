name: Auto Release

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  job-on-schedule:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git
        run: |
          git config --global user.name "${{ secrets.GIT_NAME }}"
          git config --global user.email "${{ secrets.GIT_EMAIL }}"

      - name: Build & Check Update
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          python ./build.py
          VERSION=$(cat ./*/version)

          if [ -n "$(git status --porcelain)" ]; then
            echo "文件存在更新，提交代码"
            git add .
            git commit -m "Upd ver to $VERSION at $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            # 获取最近发布间隔
            RAW_URL=https://api.github.com/repos/wabisabi926/rogsoft_openlist/releases/latest
            diff_days=$(curl -s $RAW_URL | python3 -c "import sys,json,datetime;
try:
    d=json.load(sys.stdin)
    p=datetime.datetime.strptime(d['published_at'],'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc)
    print((datetime.datetime.now(datetime.timezone.utc)-p).days)
except Exception:
    print('999')
")
            echo "距离上个Release天数: $diff_days"
            if [ "$diff_days" -gt 58 ]; then
              # 直接使用本仓库raw地址，彻底干掉BASE_URL密钥，解决Scheme missing报错
              wget --header="Authorization: token $GIT_TOKEN" https://raw.githubusercontent.com/wabisabi926/rogsoft_openlist/main/release.py
              python ./release.py --ver "$VERSION" --token "$GIT_TOKEN"
              echo "定时强制发布，避免工作流休眠"
            else
              echo "文件无变动，无需操作"
            fi
          fi

  job-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git
        run: |
          git config --global user.name "${{ secrets.GIT_NAME }}"
          git config --global user.email "${{ secrets.GIT_EMAIL }}"

      - name: Build & Create Release
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          SF_PASS: ${{ secrets.SF_PASS }}
        run: |
          python ./build.py
          VERSION=$(cat ./*/version)

          if [ -n "$(git status --porcelain)" ]; then
            echo "检测文件更新，提交代码"
            git add .
            git commit -m "Upd ver to $VERSION at $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "文件无变更"
          fi

          # 直接拉取本仓库release.py，不再依赖BASE_URL
          wget --header="Authorization: token $GIT_TOKEN" https://raw.githubusercontent.com/wabisabi926/rogsoft_openlist/main/release.py
          python ./release.py --ver "$VERSION" --token "$GIT_TOKEN"

          mkdir v"$VERSION"
          mv openlist.tar.gz ./v"$VERSION"
          sshpass -p "$SF_PASS" rsync -avz -e "ssh -o StrictHostKeyChecking=no" LICENSE README.md v"$VERSION" genius-society@frs.sourceforge.net:/home/frs/project/rogsoft-openlist/
